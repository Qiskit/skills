      confidence: verified
      caveat: "gpu-omp caps; see note"
      source: "tpb/sbdiag.h:221-234, python/sbd_solver.py:739"
      detail: >
        No hard limit on CPU — determinants are runtime-sized vectors, so
        memory binds. Thrust (`device='gpu'`) is uncapped too: both limit
        checks sit inside `#ifdef USE_OMP_OFFLOAD`, so only an
        OpenMP-offload build reaches them. The cap is therefore specific to
        `device='gpu-omp'`, which in practice means AMD — on NVIDIA a
        researcher who hits it can switch to Thrust and the ceiling is gone.
        Independently of backend, past 63 spatial orbitals needs
        sbd-eigensolver>=1.7.2; earlier versions overflow int64 converting the
        result back.
  - feature: size-ceiling
    solver: fulqrum-cpu
    python:
      value: "yes"
      display: "none"
      confidence: verified
      caveat: "memory-bound"
      source: "fulqrum/core/src/constants.hpp:22"
      detail: >
        No hard limit; memory is the real bound. The only enforced ceiling is
        width_t being uint16_t, so 65535 qubits. A prefilter changes
        representation above 128 qubits, which costs wasted work rather than
        correctness.
  - feature: size-ceiling
    solver: fulqrum-gpu
    python:
      value: "yes"
      display: "128q — determinant"
      unreleased: true
      confidence: verified
      caveat: "hard; kernel rewrite to change"
      source: "fulqrum/gpu/distributed/dist_matvec_tile_resident.py:1489"
      detail: >
        128 qubits total, 64 per spin species (64 spatial orbitals), raised as
        "the GPU operator supports 1 to 64 {name} qubits". Checked on every
        entry point — :2470, :2819 and aabb_parents.py:49 repeat it, and the
        full-string path states the same rule
        (fulqrum/gpu/full_strs/hamiltonian.py:35) — so a different operator is
        not a way around it. Half-strings are scalar unsigned long long in the
        kernels, making this a representational limit, tunable only by
        rewriting them.

        The CPU path has no hard ceiling at this width, so the same system can
        run on CPU and be rejected here.

