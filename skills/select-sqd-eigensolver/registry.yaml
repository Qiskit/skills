  - feature: complex
    solver: sbd
    engine:
      value: partial
      maturity: partial
      confidence: verified
      source: >
        references/sbd-complex-hamiltonian-support.md — assessment of
        r-ccs-cms/sbd main @ 21f73b4, 2026-08-25. Claude-authored, sourced to
        file and line, not maintainer-reviewed; see that file's provenance note.
      reference: references/sbd-complex-hamiltonian-support.md
      detail: >
        Split verdict, and the split is by model rather than by layer. For the
        chemistry paths SQD actually uses — TPB and GDB — complex is absent at
        every layer, and the headline answer for an SQD researcher is no. The
        CAOP model is where complex support is real: `caop::diag` is
        `template <typename ElemT>` (caop/basic/sbdiag.h:248) while
        `tpb::diag` is a plain non-template function (tpb/sbdiag.h:157), so
        the templating that makes complex possible covers CAOP and stops short
        of TPB. CAOP reaches Python only on main — `caop_diag_from_files`
        appears in no released tag through 1.7.2 — and the addon has no CAOP
        path at all, so nothing about it is reachable from
        diagonalize_fermionic_hamiltonian.

        The framework and solver layers beneath are genuinely
        complex-Hermitian-correct, not merely templated:
        the inner product conjugates the bra (zdotc convention,
        framework/dm_vector.h:40), the Davidson subspace fill uses the Hermitian
        form H[ib+nb*jb] = Conjugate(H[jb+nb*ib]) across tpb, gdb, caop and
        thrust variants, MatHeev dispatches to zheev_/cheev_, MatQr to
        zungqr_/cungqr_ (unitary, not orgqr), and a repo-wide grep for the
        complex-incorrect symmetric fill returns zero hits. The chemistry entry
        points are where it breaks down — see known_issues.
      known_issues:
        - >
          TPB cannot be complex at all. sbd::tpb::diag is declared
          `void diag(const MPI_Comm &` with no template header
          (tpb/sbdiag.h:157) and hardwires double through its body and RDM
          outputs, so the flagship path is real-only even though everything
          beneath it (davidson.h, mult.h, lanczos.h) is already complex-ready.
          A plumbing gap, not a math gap.
        - >
          The _UHFCPLX integral mode is silently wrong. makeintegrals.h:68 has a
          correct 4-fold-symmetry complex branch, but integrals.h only branches
          on _UHF, so _UHFCPLX falls through to 8-fold real-symmetry storage
          whose index map aliases <ij|kl> with <kl|ij>. Writing 1+0.5i reads back
          as 1-0.5i — the imaginary sign flips — and it compiles without a
          warning. The macro appears in exactly one place in the repo, so it is
          effectively vestigial.
        - >
          FCIDUMP cannot carry complex integrals. The parser reads one double
          per line (fcidump.h:69, :201) and the container is typed
          tuple<double,int,int,int,int>, so there is no on-disk route for complex
          integrals whatever ElemT is.
        - >
          caop::diag and gdb::diag take `double & energy` even when ElemT is
          complex, resolving via GetReal(E). Harmless for genuinely Hermitian
          input, but a non-Hermitian input fails quietly rather than loudly.
      verification_status: >
        Nothing tests complex. No CI anywhere in the repo; tests/ is driven by
        hand-written Makefiles and is not registered with CMake/CTest, so
        SBD_COMPLEX never reaches the test build. test_inner_product.cc — the
        test that would catch a conjugation error — is double-only, and with
        real inputs Conjugate is the identity. Zero occurrences of std::complex
        under tests/. SBD_COMPLEX defaults OFF and no CMakePresets.json preset
        enables it, so the complex configuration is rarely compiled. The
        Hermitian correctness above is correct-by-inspection plus a
        syntax-only compile, not correct-by-verification.
      caveat: CAOP only; chemistry real-only
    python:
      value: "no"
      confidence: verified
      blocked_by: not-wrapped
      detail: >
        Nothing in python/ mentions complex, and the bindings wrap tpb_diag and
        gdb_diag. Two separate reasons it could not work anyway: TPB is not
        templated on the element type at all, and the FCIDUMP route the bindings
        use to hand integrals to SBD cannot carry complex values. So this is not
        a thin wrapper gap — reaching complex from Python needs the chemistry
        entry points fixed upstream first.

        CAOP, the one model whose engine code is complex-capable, is not a way
        around this. Its Python entry point `caop_diag_from_files` exists only
        on main and in no released tag through 1.7.2, it is gated on a
        `__sbd_has_caop__` backend attribute, and the SQD addon has no CAOP
        path, so it is not reachable through
        diagonalize_fermionic_hamiltonian however it is installed.
      workaround: none

  - feature: complex
    solver: fulqrum-cpu
    python:
      value: "yes"
      maturity: supported
      confidence: verified
      since: "0.4.5"
      source: "fulqrum/core/spmv.pyx:210, :249, :280"
      detail: >
