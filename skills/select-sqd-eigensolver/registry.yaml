# SQD eigensolver capability registry
#
# Source of truth for the select-sqd-eigensolver skill. The cell format —
# the three layers, maturity, blocked_by, versioning, limits — is documented
# in EDITING_THIS_SKILL.md. Read it before adding or changing a cell.
#
# Prose notes live in capabilities.md. The shareable markdown table is
# generated by scripts/render_table.py; do not hand-edit it.

meta:
  verified_on: 2026-11-06

  # Every `file:line` citation in this registry is keyed to an entry here, so a
  # claim can be checked against the exact code it was read from. Line numbers
  # drift; these pins do not. When re-verifying, bump the pin and re-check the
  # lines rather than trusting a citation against a newer checkout.
  sources:
    pyscf:
      kind: release
      pin: "2.14.0"
      note: >
        Inspected from an installed 2.14.0 wheel, which matches
        baseline_releases.pyscf. Line numbers are stable for a released
        version.
    dice-fork:
      kind: commit
      repo: https://github.com/caleb-johnson/Dice
      branch: Riken
      pin: 3198db1f8e0066489d173d30a52bc21967969a0f
      pin_date: 2025-06-02
      note: >
        The fork build.sh clones, not upstream sanshar/Dice. build.sh clones
        without --branch, so it takes this repository's default branch, which
        is Riken rather than master. The distinction matters for the
        determinant width: this fork sets DetLen = 2, upstream sets 6. Cite
        this fork for any Dice capability the addon exposes.
    sbd-core:
      kind: commit
      repo: https://github.com/r-ccs-cms/sbd
      branch: main
      pin: 95bf45a5be9ffd977fac7b0aaa359833caf3401a
      pin_date: 2026-10-07
      describe: v1.3.0-366-g95bf45a
      note: >
        The C++ core, a different repository from the sbd-eigensolver Python
        package that baseline_releases tracks. HEAD is 366 commits past the
        newest tag, so the GPU-OMP limit macros are unreleased code — see the
        `unreleased` note in the sbd limits block.
    sbd-python:
      kind: release
      pin: "1.7.2"
      repo: https://github.com/Qiskit/sbd-eigensolver-python
      note: >
        Citations verified present at tag 1.7.2, matching
        baseline_releases.sbd-eigensolver. Every SBD citation was re-checked
        by symbol at this tag, not just carried forward.
    fulqrum:
      kind: release
      pin: "0.5.0"
      repo: https://github.com/Qiskit/fulqrum
      note: >
        The public CPU package, which baseline_releases.fulqrum tracks.
        Citations verified at tag 0.5.0. The repository moved from
        qiskit-community to the Qiskit org; the old URL redirects.
    fulqrum-gpu:
      kind: commit
      repo: https://github.com/Qiskit/fulqrum
      branch: v1.0.0-rc
      pin: 2e2d66e
      pin_date: 2026-11-06
      note: >
        The GPU module, public on the v1.0.0-rc branch as one commit on top of
        the 0.5.0 tag.

        The branch declares `__version__ = "1.0.0"`, so `fulqrum>=1.0.0` is
        the floor that means "has the GPU module". It is a release candidate:
        no tag, nothing on PyPI, so the fulqrum-gpu cells stay
        `unreleased: true` and the floor is what to state once it ships.
  # Every bare `value: "yes"` below means "supported in these releases".
  # Re-check and bump these when re-verifying.
  #
  # PyPI usually runs ahead of these. Leave the baselines at the versions whose
  # cells were actually verified rather than bumping them to match: a bare
  # `value: "yes"` means "supported in solvers[].latest_release", so moving that
  # number re-asserts every capability cell against code nobody re-read. Where
  # a packaging fact was re-read from a newer release than the baseline, the
  # solver's packaging detail says which of its claims are current.
  baseline_releases:
    qiskit-addon-sqd: "0.14.0"
    pyscf: "2.14.0"
    sbd-eigensolver: "1.7.2"
    fulqrum: "0.5.0"
    qiskit-addon-dice-solver: unreleased
  # Upstream repositories, not local checkout paths — a path on one machine
  # tells a reader nothing. Where a claim was read from a working tree rather
  # than a release tag, the cell says so.
  verified_against:
    qiskit-addon-sqd: github.com/Qiskit/qiskit-addon-sqd
    qiskit-addon-dice-solver: github.com/Qiskit/qiskit-addon-dice-solver
    dice: github.com/caleb-johnson/Dice (the fork build.sh clones; upstream is sanshar/Dice)
    sbd-eigensolver-python: github.com/Qiskit/sbd-eigensolver-python
    sbd-upstream: github.com/r-ccs-cms/sbd
    fulqrum: github.com/Qiskit/fulqrum (qiskit-community/fulqrum redirects here)
    fulqrum-gpu: github.com/Qiskit/fulqrum, v1.0.0-rc branch

# The sci_solver interface, stated once because it explains most addon-layer
# losses below.
interface_constraints:
  positional_call:
    source: qiskit_addon_sqd/fermion.py:780
    detail: >
      diagonalize_fermionic_hamiltonian calls the solver as
      sci_solver(ci_strings, one_body_tensor, two_body_tensor, norb, nelec) —
      five positional arguments, no keywords forwarded. Every solver option in
      this registry is keyword-only, so none is reachable without binding it
      first.
    workaround: "sci_solver = partial(solve_sci_batch, spin_sq=0.0)"
  consumed_result_fields:
    source: qiskit_addon_sqd/fermion.py:_process_sci_results
    detail: >
      The loop reads energy, orbital_occupancies, sci_state and carryover from
      each SCIResult. It never reads rdm1 or rdm2, and
      diagonalize_fermionic_hamiltonian returns only the single best SCIResult.
      RDMs therefore reach the researcher only on that one object, and only if
      the solver populated them.
  subspace_shape:
    detail: >
      ci_strings is a pair (strings_a, strings_b) whose Cartesian product spans
      the subspace. The interface cannot express a flat list of full
      determinants, so a GDB subspace has no representation in it. The
      restriction is inherited from PySCF. SBD and Fulqrum both support general
      subspaces below the addon, which can represent a state of interest with
      far fewer configurations, so for them this interface is what stands in
      the way. Dice does not — see the gdb/dice cell, which corrects the solver
      list in the tracking issue.
    tracking: https://github.com/Qiskit/qiskit-addon-sqd/issues/389

# Two incompatible ways of getting MPI parallelism, and which one a solver uses
# decides how the researcher launches their program. This is not a capability
# either solver is missing — both are parallel — so it does not fit a matrix
# cell, but it is often the first thing a cluster user needs to know.
execution_models:
  solver_spawns_mpirun:
    solvers: [dice]
    detail: >
      The calling program runs as a single ordinary process, outside any MPI
      environment, and the solver launches its own workers. The
      qiskit-addon-dice-solver bridge shells out through mpirun on every
      diagonalization (dice_solver.py:523 _call_dice), with mpirun_options
      passed straight through.
    launch: "python my_program.py — NOT under mpirun"
    detail_tradeoffs: >
      Works in a notebook and needs no MPI-aware setup, which is why the HPC
      guide keeps it for interactive work — and the reason this model survives
      rather than being superseded. Costs: a process launch per
      diagonalization, and the ranks exist only for the duration of each call,
      so nothing is reused across iterations. Running the program itself under
      mpirun is wrong here and will not do what the researcher expects.
  collective_spmd:
    solvers: [sbd]
    since: {qiskit-addon-sqd: "0.13.0"}
    detail: >
      The whole Python process runs under one launcher — `mpirun -n 128 python
      my_program.py` — and diagonalize_fermionic_hamiltonian is called
      collectively from every rank. The sci_solver step is the only collective
      operation: all ranks participate in it, so the solver can spread one
      diagonalization across every process, while preparing CI strings,
      processing results and checking convergence happen on the control process
      alone. The return value is broadcast, so it is the same on every rank.
      sbd.solve_sci takes mpi_comm and defaults to MPI.COMM_WORLD
      (python/sbd_solver.py:76, :115-117).
    launch: "mpirun -n <N> python my_program.py"
    detail_tradeoffs: >
      The direction the ecosystem is moving, and what the upstream HPC guide
      recommends: it composes with job schedulers and other parallel software,
      and scales to large process counts. One MPI setup for the whole run
      rather than one per diagonalization. Costs: every rank must reach the
      collective call with arguments that agree, and the program has to be
      launched under MPI — see `rules_out_notebooks`.
    rules_out_notebooks: >
      A Jupyter notebook cannot use this model. The kernel is one process
      started by the notebook server, not by mpirun, so there is nothing to run
      collectively; `mpirun -n N python my_program.py` has no notebook
      equivalent.

      So treat notebook use as a selection criterion rather than a preference:
      if the researcher needs to work in a notebook, the collective model is
      out, whatever else recommends it. That rules out SBD's MPI path and
      leaves either a single-process SBD run or a solver that spawns its own
      ranks. Interactive development in a notebook followed by a batch script
      for production is a reasonable split, and worth suggesting when someone
      wants both.
    addon_support:
      source: "qiskit_addon_sqd/fermion.py — diagonalize_fermionic_hamiltonian Note"
      confidence: verified
      detail: >
        Added in qiskit-addon-sqd 0.13.0 (releasenotes/notes/0.13/
        spmd-support-214a17c1c745a761.yaml). diagonalize_fermionic_hamiltonian
        is the only API that may be called collectively; everything else must
        be called from the control process alone. The helpers live in
        qiskit_addon_sqd.processes — is_mpi_execution, process_index,
        process_count, is_control_process, broadcast, barrier.
      caveat: >
        The default PySCF sci_solver is not distributed, so collective mode is
        only useful with a solver that is. Pairing SPMD launch with the default
        solver gains nothing.
    notes: >
      A collective solver may also split the ranks into groups and diagonalize
      several subspaces at once, since every subspace of an iteration arrives in
      one sci_solver call. The addon does not divide the processes and nothing
      in its interface describes them, so that is the solver's own concern.
  docs:
    - url: https://quantum.cloud.ibm.com/docs/addons/qiskit-addon-sqd/guides/hpc-acceleration
      what: >
        The upstream HPC acceleration guide: both execution models, why SPMD is
        recommended, which APIs are collective, and the threading and
        error-handling expectations. The page to send a cluster user to.

# How a solver gets its parallelism is a cross-cutting constraint rather than a
# per-solver feature, because it decides how the researcher launches their
# program. Recorded once in `execution_models` below and referenced from the mpi
# cells.

# Per-solver `apis` field (optional): the ways a solver can be consumed, when
# more than one exists and they differ in integration cost. A solver's install
# story is often told only for Python, which misleads anyone working in another
# language -- SBD from C++ is header-only, while SBD from Python is a source
# build. List each with `language`, `surface`, optional `header_only`, and a
# `detail` saying what integration actually involves.
#
# Per-solver `packaging` field:
#   pypi         distribution name on PyPI, or `none`
#   pypi_install what `pip install <name>` actually does — the field that matters
#                more than mere presence on PyPI:
#                  pure-python  no compiled extension; installs anywhere
#                  wheels       binary wheels cover every supported platform
#                  wheels-partial
#                               wheels for some platforms, source build on the
#                               rest. Record which in `pypi_detail`.
#                  compiles     sdist only; pip compiles on the host machine
#                  placeholder  a name reservation, not a usable release
#   pypi_platforms  platforms covered by wheels, when pypi_install is wheels or
#                   wheels-partial
#   conda_forge  "available" | "in-progress" | "none"
#   tracking     the staged-recipes PR or feedstock issue, when one exists
#
# The pure-python/wheels vs compiles split is the practical question: a wheel
# install needs no toolchain, a source build needs whatever the extension
# needs. conda-forge matters separately, because a researcher on a
# conda-managed stack cannot mix a source-compiled C++ extension into it
# without care. Checked 2026-10-21 against pypi.org and api.anaconda.org.

# Per-solver `docs` field: hosted documentation a researcher can be pointed at.
# A list of {url, what} entries, most useful first. `what` says what the link
# actually answers, so the skill can cite the page that addresses the question
# instead of dropping a bare landing-page URL.
#
# Include a `stale` note when hosted docs disagree with this registry. That
# happens, and a researcher who reads the upstream page will believe it over an
# agent, so the disagreement must be stated rather than quietly resolved.
#
# Per-solver `paper` field: the citation the package itself asks for, as
# {title, authors, arxiv, url, citing_page, describes}. `describes` records
# which of the solver's design claims the paper is the source for, since that is
# what makes it worth reading rather than merely worth citing. Only record a
# paper the project actually points to.

solvers:
  - id: pyscf
    name: PySCF selected CI
    engine: PySCF fci.selected_ci
    python: qiskit_addon_sqd.fermion.solve_sci
    is_default: true
    latest_release: "2.14.0"
    build: pip
    packaging:
      pypi: pyscf
      pypi_version: "2.15.0"
      pypi_install: wheels
      pypi_platforms:
        [linux-x86_64, linux-aarch64, macos-x86_64, macos-arm64, windows-x86_64]
      pypi_detail: >
        Five py3-none-<platform> wheels, so one wheel per platform covers every
        Python version, and pip install needs no toolchain on any of them. The
        win_amd64 wheel arrived in 2.15.0, which also declares `Operating
        System :: Microsoft :: Windows`, so PySCF is the only solver in this
        registry installable on native Windows and needs 2.15.0 or newer to be.
        The packaging facts here were read from 2.15.0 metadata; the code
        citations in this cell (the orbital ceiling, the cistring.py lines)
        were verified against baseline_releases.pyscf 2.14.0 and not re-checked
        since.
      conda_forge: available
      conda_forge_version: "2.14.0"
      conda_forge_detail: >
        win-64 builds are available, so native Windows works on this channel
        too. Unlike PyPI these are per-Python rather than one wheel per
        platform, so a new Python release can reach conda-forge later.
    limits: >
      126 qubits (63 spatial orbitals), and the ceiling is hard: PySCF raises
      NotImplementedError rather than degrading. CI strings are packed one per
      signed numpy int64, so bit 63 is the sign bit and unusable, leaving 63
      spatial orbitals. Enforced at a dozen sites in pyscf/fci/cistring.py —
      `norb >= 64` raises at cistring.py:346, 367, 384, 411 and 446, and the
      string-generating paths raise "System with 64 orbitals or more" at
      cistring.py:265 and 289. Not tunable: the limit is the width of the
      integer type the representation is built on, not a parameter. Source pin:
      meta.sources.pyscf.
    docs:
      - url: https://pyscf.org/user/ci.html
        what: >
          Configuration interaction user guide, including the selected-CI
          solver this path uses.
      - url: https://pyscf.org/
        what: Documentation root, for everything upstream of the solver.
      - url: https://qiskit.github.io/qiskit-addon-sqd/
        what: >
          The SQD addon's own documentation, which is where `solve_sci` and
          `diagonalize_fermionic_hamiltonian` are documented. Relevant to every
          solver here, not only PySCF.
    notes: >
      The default solver, shipped in the same package as the loop, so the only
      layer-3 friction is keyword binding. The loop itself
      (qiskit-addon-sqd 0.14.0) is also on conda-forge, so a pure-PySCF SQD
      workflow installs entirely from conda-forge. qiskit-addon-sqd 0.14.1
      dropped the `sys_platform != "win32"` marker from its pyscf dependency,
      so the addon now requires pyscf on every platform; 0.14.0 and earlier
      made it conditional, which is why a Windows install of the addon used to
      come up without a solver.

  - id: dice
    name: Dice (SHCI)
    engine: Dice SHCI binary (caleb-johnson fork, built by build.sh)
    python: qiskit_addon_dice_solver.solve_sci
    role: >
      Two separable pieces, and most of this column's losses are at the seam.
      Dice itself is a mature standalone SHCI code. qiskit-addon-dice-solver is
      a Python/addon bridge over it: it writes input.dat plus the determinant
      files, shells out to the binary through mpirun, and parses the output
      back into an SCIResult. It implements no diagonalization of its own.

      So when a capability is missing here, say which piece is missing it. The
      RDMs are the worked example — the engine computes them and the bridge
      drops them on the way back, which is a different fact from "Dice cannot
      do RDMs" and points at a different workaround.
    latest_release: "0.3.0"
    latest_release_detail: >
      Tagged 0.1.0 (2024-09), 0.2.0 (2025-01) and 0.3.0 (2025-03) on GitHub, but
      never published to PyPI — the PyPI name holds only a 0.0.0.dev0
      placeholder. So "released" here means a git tag to check out, not
      something pip can fetch.

      0.3.0 exposes solve_dice, solve_fermion and solve_hci. The solve_sci
      entry point — the one that plugs into diagonalize_fermionic_hamiltonian
      as an sci_solver — and its n_roots argument exist only on main, 24
      commits past the tag. Cells below distinguish the two.

      Recommend main over any tag for this solver. Installation is a git
      checkout plus build.sh regardless, so a tag offers none of the usual
      benefits — no wheel, no resolver guarantee — and the latest tag predates
      the interface that makes Dice work with the addon. This is a deliberate
      exception to the general preference for released versions, and it holds
      only because nothing here is distributed.
    build: heavy
    build_detail: >
      C++ toolchain, MPI, HDF5, a Rust toolchain for the Python package, and
      Boost 1.85.0 compiled from source by build.sh, which also clones and
      makes the Dice fork. x86_64 with Ubuntu 22.04 or 24.04; Fedora is
      unsupported and build.sh hardcodes a Debian HDF5 path.
    engine_only: >
      Full SHCI — multi-iteration selection, perturbative corrections, RDM
      output. The addon pins Dice to a single Davidson pass by setting a maximal
      select_cutoff, so none of that is reachable from Python.
    limits: >
      128 qubits (64 spatial orbitals), hard. A determinant is a fixed array of
      two 64-bit words — `const int DetLen = 2` in SHCI/global.h:32, used as
      `long repr[DetLen]` in SHCI/Determinants.h:177 — giving 2 x 64 = 128 spin
      orbitals, which is 128 qubits. The half-determinant class HalfDet uses
      `repr[DetLen / 2]` (Determinants.h:72), one word per spin species.
      Tunable only by editing DetLen and recompiling the engine, which the
      addon's build.sh does not expose. Note this is a property of the fork the
      addon builds, not of Dice generally: upstream sanshar/Dice sets
      DetLen = 6. An earlier revision of this registry recorded "128 orbitals,
      from 16-byte determinant addresses", which was wrong in both unit and
      mechanism. Source pin: meta.sources.dice-fork.
    docs:
      - url: https://qiskit.github.io/qiskit-addon-dice-solver/
        what: >
          Documentation for qiskit-addon-dice-solver, the Python/addon bridge
          that drives the Dice binary and presents it to the SQD addon.
          Covers supported platforms, the build.sh installation sequence and
          the bridge's limitations. The place to look for anything about
          getting Dice to talk to the loop, as opposed to what the SHCI engine
          itself can do.
        stale: >
          Documents 0.3.0, so its API reference lists only solve_fermion and
          solve_hci. `solve_sci` — the entry point that plugs into
          diagonalize_fermionic_hamiltonian — and `n_roots` are main-only and
          appear nowhere on this site. A researcher reading it will conclude
          there is no sci_solver interface. Say so when citing it.

          Its Limitations section also states the size ceiling as "128 or fewer
          orbitals" from 16-byte determinant addresses. This registry's `limits`
          block corrects both the unit and the mechanism: `DetLen = 2` gives 128
          qubits, which is 64 spatial orbitals. Use this registry's figure.
      - url: https://sanshar.github.io/Dice/
        what: >
          Upstream Dice documentation — the SHCI algorithm, input keywords and
          benchmarks. Describes full SHCI, most of which the addon pins out, so
          read it for the engine rather than for what the wrapper exposes.
    packaging:
      pypi: qiskit-addon-dice-solver
      pypi_version: "0.0.0.dev0"
      pypi_install: placeholder
      conda_forge: none
      detail: >
        The PyPI name exists but holds only a 0.0.0.dev0 name reservation, so
        `pip install qiskit-addon-dice-solver` does not give a working package.
        Install from a git checkout after build.sh compiles Boost and the Dice
        fork. Treat this as not distributed.

  - id: sbd
    name: Selected Basis Diagonalization
    engine: SBD C++ core and CLI apps
    python: sbd.solve_sci / sbd.gdb_diag
    latest_release: "1.7.2"
    build: compiles-cpp
    build_detail: >
      Compiles C++ on install; MPI; optional NVHPC or OpenMP-offload toolchains
      for the GPU backends. No published wheels.
    engine_only: >
      CAOP (creation/annihilation operator) diagonalization, in
      vendor/sbd-upstream/apps/caop_selected_basis_diagonalization/. Not wrapped.
    apis:
      - language: python
        surface: sbd.solve_sci / sbd.gdb_diag
        detail: >
          pybind11 bindings. Installed from PyPI as an sdist, so pip compiles
          the extension modules on the host.
      - language: c++
        surface: "#include <sbd/...> — dozens of headers under include/sbd/"
        header_only: true
        detail: >
          Header-only. No compiled library to build or link: CMake declares
          add_library(sbd_headers INTERFACE) and include/ holds no .cc/.cpp
          sources. Consuming it from C++ means adding an include path, which is
          a much lighter integration than the Python route's source build
          suggests. The CLI apps under apps/ are separate programs built on
          these headers, and CAOP exists only there.
    docs:
      - url: https://qiskit.github.io/sbd-eigensolver-python/
        what: >
          The Python bindings' documentation: the backend table (cpu, gpu,
          gpu-omp), the TPB-vs-GDB discussion, the `sci_solver` integration
          snippet with DeviceConfig and sbd_config, and the API reference.
          The best single page to hand someone choosing SBD.
      - url: https://github.com/r-ccs-cms/sbd
        what: >
          The upstream C++ core, a different repository from the Python
          package. Where the CLI apps and CAOP live, and what the engine-layer
          cells and limit macros are read from.
    packaging:
      pypi: sbd-eigensolver
      pypi_version: "1.7.2"
      pypi_install: compiles
      conda_forge: in-progress
      tracking: https://github.com/conda-forge/staged-recipes/pull/35125
      detail: >
        Source distribution only — zero wheels published, so pip compiles the
        extension modules on the install machine and the backends you get depend
        on the toolchain the build finds. The README says as much. A conda-forge
        recipe is under review in staged-recipes#35125, which would make this
        the first non-PySCF solver installable without a local build.
    limits: |-
      Depends on the backend, and the varying axis is CPU vs. GPU rather than
      TPB vs. GDB.

      **CPU:** no hard limit. Determinants are nested `std::vector<size_t>`,
      sized at runtime by `det_vector::init_elem_size` (tpb/sbdiag.h:219), so
      width grows with the system and memory is what binds.

      **GPU (Thrust, `device='gpu'`):** no hard limit either. Both checks
      below are compiled only `#ifdef USE_OMP_OFFLOAD`, so a Thrust build
      never reaches them and behaves like the CPU path.

      **GPU (OpenMP offload, `device='gpu-omp'`, `USE_OMP_OFFLOAD` builds):**
      256 spin orbitals / 128 spatial orbitals, hard. Two fixed-size macros
      apply, both at chemistry/basic/omp_offload.h:14-15, and the tighter one
      binds.

      Because Thrust is uncapped, this ceiling is in practice an AMD
      constraint: `gpu-omp` is the only GPU path for AMD, while an NVIDIA user
      can switch to `device='gpu'` instead of recompiling. Raising it for AMD
      means editing the macro and also adjusting the Python package's
      setup.py, so it is not purely an upstream C++ change.
      `SBD_MAX_SPINORBITALS = 256` caps spin orbitals directly, checked as
      `2*norbs > SBD_MAX_SPINORBITALS` at tpb/sbdiag.h:230.
      `SBD_MAX_DETSIZE = 16` caps the packed determinant at 16 words, checked
      at tpb/sbdiag.h:225. Words hold `bit_length` bits rather than 64, so at
      the default `bit_length` of 20 that second macro permits of order a few
      hundred spin orbitals — the spin-orbital cap is what a researcher
      actually hits. Raising `bit_length` loosens the determinant-size
      constraint and never the spin-orbital one. Both are tunable by editing
      the macros and recompiling.

      Treat 256 as "of order a few hundred": it is a compile-time constant
      someone may well have bumped, so read the macros in the tree being used
      rather than quoting this figure.

      **The abort exits zero.** Both checks call
      `MPI_Abort(MPI_COMM_WORLD, 0)`, so the job prints a diagnostic and
      terminates with a success status. A batch script, a `make` recipe or a
      `subprocess.check_call` therefore reads an over-cap run as having
      succeeded, and the researcher sees a missing result rather than a
      failure. Tell anyone sizing a `gpu-omp` run to check the output rather
      than the exit code.

      Both conditions are also guarded by `mpi_rank == 0`, so only rank 0
      evaluates them while other ranks continue into the fixed-size arrays the
      macros protect. Reported upstream as
      https://github.com/r-ccs-cms/sbd/issues/115, which also covers the
      exit-zero status.

      **Caveat: these checks are unreleased.** They entered the C++ core in
      commit d814f68, which is on no tag, and HEAD sits 366 commits past
      v1.3.0 — a build from a released tag has no such guard.

      The guards live only in tpb/sbdiag.h and apply only to the OpenMP-offload
      backend. They are absent from gdb/sbdiag.h, but that is not a gap: no
      file under chemistry/gdb/ references USE_OMP_OFFLOAD at all, so GDB has
      no OpenMP-offload path and never reaches the fixed-size arrays the macros
      protect. GDB's GPU support is the Thrust backend (`device='gpu'`,
      gdb/*_thrust.h), which uses its own representation. The Python wrapper
      does document `device='gpu-omp'` for gdb_diag and dispatches to
      `backend.gdb_diag`, so what such a call does is a question about the
      bindings rather than about these limits — untested here.

      **All backends:** `bit_length` must stay <= 63. `bitadvance()` in
      framework/bit_manipulation.h computes `(1 << bit_length) - 1` on a 64-bit
      `size_t`, so 64 is undefined behavior; in practice the shift is masked to
      zero and the mask collapses. The Python wrapper documents this and
      defaults to 20 (`SBD_DEFAULT_BIT_LENGTH`, python/sbd_solver.py:41).

      **Python layer:** past 63 spatial orbitals needs
      `sbd-eigensolver>=1.7.2`, whatever the backend allows. Earlier versions
      overflow int64 converting the result back, so `solve_sci` raises
      OverflowError at 64 orbitals and hangs instead under MPI
      (`_ci_string_dtype`, python/sbd_solver.py:739). Below 64 orbitals the
      version makes no difference.

      Source pins: meta.sources.sbd-core, meta.sources.sbd-python.
    notes: >
      device= selects 'cpu', 'gpu' (Thrust/CUDA, NVIDIA only) or 'gpu-omp'
      (OpenMP offload, NVIDIA or AMD) per call. Every backend the toolchain
      supports builds into one install.

  - id: fulqrum-cpu
    name: Fulqrum (CPU)
    engine: Fulqrum Cython/C++ core
    python: fulqrum.SubspaceHamiltonian + an eigensolver the caller chooses
    not_an_eigensolver: >
      Fulqrum is not an eigensolver. It builds the subspace Hamiltonian and
      implements the sparse matrix-vector product; the caller supplies the
      eigensolver and iterates. Describing it as an eigensolver misstates what
      the package does and obscures why it is on this list, so state the split
      when introducing it.

      This is about the division of labour, not about integration effort.
      Since 0.5.0 Fulqrum ships the SQD addon adapter itself, so the split
      costs an `eigensolver=` argument rather than writing glue code.

      Two eigensolvers are in routine use against it, and the choice is a real
      one:

        scipy  scipy.sparse.linalg.eigsh (ARPACK). Already a hard dependency,
               so nothing to install. What every page of the hosted docs and
               both tutorials use. The default recommendation.
        primme Optional dependency, minimum 3.2.3, listed under Optional in
               docs/install.rst. Generally better performance, and what the
               repository's own benchmarks use throughout
               (benchmarks/test/test_h2o_full.py:64,
               test_ch4_dimer_1e6.py:55, both with
               method="PRIMME_DEFAULT_MIN_MATVECS"). Covered by
               fulqrum/test/test_primme.py in both matrix-free and
               csr-fast modes.

      So: scipy for an easy install, PRIMME for performance. The hosted docs
      name only scipy, so PRIMME has to be mentioned rather than looked up.
      This registry holds no head-to-head timing, so do not quote a speedup
      figure — say PRIMME generally performs better and leave it there.

      Both consume the same object, so switching is a one-line change and not a
      re-integration. Three input routes, per the docs: Hsub itself
      (matrix-free, least memory, slowest), to_csr_linearoperator(), and
      to_csr_linearoperator_fast() (about 2x the memory, and the one the docs
      say to try first).
    latest_release: "0.5.0"
    build: compiles-cpp
    build_detail: "Compiles C++ (Boost headers vendored, OpenMP 3+)."
    is_sci_solver: true
    is_sci_solver_detail: >
      Since 0.5.0, via `fulqrum.addon_sqd_support.sci_solver_from_integrals`
      (fulqrum/addon_sqd_support.py:42) — pass its return value straight to
      `diagonalize_fermionic_hamiltonian(..., sci_solver=...)`. Install as
      `pip install "qiskit-addon-sqd[fulqrum]"`. On 0.4.5 and earlier there was
      no adapter and the caller wrote it, so state `fulqrum>=0.5.0` — the
      addon's extra only requires >=0.4.4, which an older pin satisfies
      without the adapter. The extra also installs PRIMME. Fulqrum still is
      not an eigensolver: the factory takes an `eigensolver=` argument and
      defaults to `scipy.sparse.linalg.eigsh`.
    packaging:
      pypi: fulqrum
      pypi_version: "0.5.0"
      pypi_install: compiles
      conda_forge: in-progress
      tracking: https://github.com/conda-forge/staged-recipes/pull/35533
      detail: >
        Source distribution only — no wheels — so pip compiles the Cython
        extensions on the host. A conda-forge recipe is in review at
        staged-recipes#35533. Its PRIMME tests are excluded because PRIMME is
        not on conda-forge yet; that recipe is staged-recipes#35091.
    paper:
      title: A generalized framework for quantum subspace diagonalization
      authors: Paul D. Nation, Abdullah Ash Saki, Hwajung Kang
      arxiv: "2603.18731"
      url: https://arxiv.org/abs/2603.18731
      citing_page: https://qiskit.github.io/fulqrum/citing.html
      describes: >
        The citation the project asks for, and the source for Fulqrum's design
        rather than merely a reference to drop in a bibliography. It is where
        three claims in this registry come from: the extended operator alphabet
        (projection and ladder operators beyond the Pauli set) that lets one
        code base cover both fermionic and spin systems; bit-set encoding of
        bit-strings, which is the mechanism behind the "no hard limit" in
        `limits`; and the deliberate separation of subspace construction from
        eigensolving, which is why the caller supplies the eigensolver.

        The paper does not name Fulqrum — it describes the framework the package
        implements. Cite it as the paper behind Fulqrum's approach, not as a
        paper about the package.

        Reports reduced memory and runtime against prior approaches, "in some
        cases by an order of magnitude or more". Quote that as the paper's claim
        rather than as this registry's finding; nothing here reproduces it.
    docs:
      - url: https://qiskit.github.io/fulqrum/subspace_hamiltonians.html
        what: >
          How to get eigenvalues out of a SubspaceHamiltonian: the three input
          routes, the LinearOperator subclassing that makes matrix-free mode
          work, and interpret_vector for reading an eigenvector back as
          bit-strings. The page to read before writing the adapter.
      - url: https://qiskit.github.io/fulqrum/tutorials/n2_full_sqd_loop.html
        what: >
          A full SQD loop on N2 written against Fulqrum — the closest thing to
          a worked example of the adapter a researcher would otherwise write
          from scratch. Also shows seeding v0 from the Hamiltonian diagonal.
      - url: https://qiskit.github.io/fulqrum/install.html
        what: >
          Dependencies, including PRIMME under Optional, and the note that
          clang outperforms gcc for this code.
      - url: https://qiskit.github.io/fulqrum/
        what: Documentation root — user guide, tutorials and API reference.
    limits: >
      No hard limit; memory is the real bound. Nothing rejects a wide subspace.
      The only enforced ceiling is width_t being uint16_t, so 65535 qubits
      (fulqrum/core/src/constants.hpp:22), checked per term by
      _validate_indices.

      One width-dependent taper, and it is in the off-diagonal paths rather
      than the diagonal precompute. The paired-group prefilter keys each
      half-string into a uint64: at width <= 128 qubits total, half_key packs
      the half exactly; above that a multi-word hash takes over
      (`half_fits_in_word = width <= 2 * BITS_PER_BLOCK`,
      fulqrum/core/src/type2_group_table.hpp:500, dispatched at :445, with
      split_point = width / 2 at :498). The key only gates whether a candidate
      is looked up (type2_prefilter_pairs, :877 and :892), so a hash collision
      costs wasted work and never a wrong result. The same threshold governs
      matvec2.hpp, csr2.hpp and csrlike_builder2.hpp, which share the dispatch.

      The diagonal precompute has no width threshold at all.
      compute_diag_vector_fast is selected by operator structure, not size:
      fast_diag_compatible tests type == 2, is_diagonal, a term count of
      W*(W+1)/2 and all-'1' projectors (fulqrum/core/src/diag.hpp:93). Both it
      and compute_diag_vector take the same boost::dynamic_bitset rows, and
      `_disable_fast_diag` (fulqrum/core/spmv.pyx:146) is a manual override
      rather than a size gate.

      The 64-qubits-per-spin-species figure belongs to the GPU path, not here:
      see the fulqrum-gpu limits block, where half-strings are scalar unsigned
      long long and the builders reject more than 64 orbitals per sector. The
      two ceilings have different widths and different mechanisms, so do not
      merge them. Source pin: meta.sources.fulqrum.
    limits_verification_status: >
      Established by reading the 0.5.0 tree, not by running it: no build, no
      timing, and no test exercising width > 128 was identified. The citations
      were checked by symbol at tag 0.5.0. Scope is the core engine —
      fulqrum/core/src/*.hpp and fulqrum/core/spmv.pyx. The ramps/, convert/
      and utils/ subpackages were not swept, so a width assumption there would
      not have been caught.
    notes: >
      Decouples operator construction from eigensolving: builds a
      SubspaceHamiltonian that behaves as a SciPy LinearOperator and leaves the
      eigensolver to the caller — scipy's eigsh or PRIMME, per
      `not_an_eigensolver`. Multiple roots and general subspace manipulation
      both follow from that design. Using it inside
      diagonalize_fermionic_hamiltonian means writing the adapter yourself; the
      N2 tutorial in `docs` is the closest worked example.

  - id: fulqrum-gpu
    name: Fulqrum (GPU)
    engine: Fulqrum CUDA kernels (fulqrum/gpu/kernels)
    python: fulqrum.gpu.*Hamiltonian + distributed_primme_eigsh
    not_an_eigensolver: >
      Same split as the CPU package: it supplies the GPU-resident matrix-vector
      product, not the eigensolver. The distributed path is built around PRIMME
      rather than leaving the choice open, so --ncv is the knob that controls
      basis size and VRAM pressure. PRIMME is used with Fulqrum's own patches,
      eight of them under patches/primme/, so this is a patched PRIMME rather
      than the packaged one.
    latest_release: none
    latest_release_detail: >
      Nothing published; every claim here describes unreleased code. The
      branch, its declared version and the floor to ask for once it ships are
      in meta.sources.fulqrum-gpu.
    build: compiles-cuda
    build_detail: >
      The CPU requirements plus a CUDA toolkit (nvcc, cuBLAS, cuSPARSE, cudart)
      and FQ_BUILD_GPU=1. Also Open MPI with a matching mpi4py, and OpenBLAS
      ILP64 with `_64_`-suffixed symbols — GPU_INSTALL.md states that ordinary
      LP64 BLAS and the private libraries inside NumPy and SciPy wheels are not
      acceptable substitutes. A driver or a CuPy wheel alone does not supply
      the toolchain. The reference stack is CUDA 13.3, CuPy 14.1, mpi4py 4.1,
      OpenBLAS ILP64 0.3.34, on H100 (sm_90).
    is_sci_solver: false
    packaging:
      pypi: none
      pypi_install: none
      conda_forge: none
      detail: >
        Not distributed. The `fulqrum` sdist on PyPI is the CPU package and
        carries none of the CUDA paths; the GPU build is a source build from
        the branch with FQ_BUILD_GPU=1.
    limits: >
      128 qubits total, 64 per spin species (64 spatial orbitals), hard.
      Enforced in Python rather than in the kernels: "the GPU operator supports
      1 to 64 {name} qubits", raised per sector at
      fulqrum/gpu/distributed/dist_matvec_tile_resident.py:1489, with further
      `2 <= n <= 64` checks at :2470 and :2819 and in
      fulqrum/gpu/distributed/aabb_parents.py:49. The full-string path states
      the same rule (fulqrum/gpu/full_strs/hamiltonian.py:35). The mechanism is
      representational — half-strings are scalar unsigned long long in the
      kernels — so it is tunable only by rewriting them for multi-word
      half-strings, not by a recompile.

      The CPU path has no hard ceiling at this width; it switches its
      half-string prefilter to a multi-word hash and keeps going. So the same
      system can run on CPU and be rejected outright on GPU.
      Source pin: meta.sources.fulqrum-gpu.
    notes: >
      Four operators, all reached through `fulqrum.gpu`: GPUHamiltonian for a
      single device, TileGPUResidentHamiltonian and DistributedMPIGPUHamiltonian
      for distributed runs, and FullStrsHamiltonian for an explicit determinant
      set. Narrower than the CPU path in two ways: real type-2 operators only,
      and 64 orbitals per spin sector. Multi-GPU is by MPI rank, so
      `len(gpu_ids) > 1` bounds one rank to one GPU and is not a single-GPU
      limit.

      Well tested, but the whole GPU suite needs a CUDA device and no CI runner
      has one, so it passes where someone runs it rather than on every commit.
      What establishes each capability is in that cell's `verified_by`.

features:
  - id: rdm
    name: 1- and 2-RDM
    relevance: Required in the context of fragmentation and embedding workflows.
  - id: spin-penalty
    name: Spin penalty <S^2>
    relevance: Controls spin contamination.
  - id: multiple-roots
    name: Multiple roots
    relevance: For evaluating excited states.
  - id: tpb
    name: TPB (tensor product basis)
    relevance: >
      Subspace is the Cartesian product of alpha and beta determinant lists.
      The mature path across every solver here.
  - id: gdb
    name: GDB (generalized determinant basis)
    relevance: >
      Arbitrary sparse determinant list. Produces smaller subspaces and lower
      memory requirements than TPB.
  - id: gpu
    name: GPU support
  - id: subspace-manipulation
    name: General subspace manipulation
    relevance: >
      Abstracting out the matrix-vector product supports use cases beyond
      eigenvalue estimation, e.g. Green's function computations.
  - id: complex
    name: Complex-valued Hamiltonians
  - id: mpi
    name: MPI / multi-node
  - id: windows
    name: Native Windows
    relevance: >
      Native Windows, not WSL or a container. Decides the recommendation
      before any feature does.
  - id: size-ceiling
    name: Size ceiling
    relevance: >
      The largest system the solver accepts. Usually the reason to leave the
      default. Read the note as well as the number: what gets packed differs
      (CI string vs. determinant), and so does whether a recompile moves it.
  - id: install-cost
    name: Install cost
    relevance: >
      What `pip install` demands, and whether conda-forge is an option. A
      preference rather than a filter, but it decides what survives an
      environment rebuild.
  - id: addon-adapter
    name: Ships an addon adapter
    relevance: >
      Whether something can be handed to
      `diagonalize_fermionic_hamiltonian(sci_solver=...)` without writing glue.

matrix:

  # ── RDMs ──────────────────────────────────────────────────────────────────
  - feature: rdm
    solver: pyscf
    python:
      value: "yes"
      confidence: verified
      source: "qiskit_addon_sqd/fermion.py solve_sci"
      detail: "make_rdm1/make_rdm2 are computed and passed to SCIResult."

  - feature: rdm
    solver: dice
    engine:
      value: "yes"
      since: "0.3.0"
      confidence: verified
      source: "dice_solver.py:594"
      detail: >
        The addon requests all four — DoSpinRDM, DoRDM, DoSpinOneRDM, DoOneRDM —
        so Dice computes the RDMs and writes spin1RDM.*.txt.
    python:
      value: not-returned
      confidence: verified
      source: "dice_solver.py:455, :129, :132"
      blocked_by: not-returned
      detail: >
        _read_dice_outputs loads only spin1RDM.0.0.txt and keeps just the
        diagonal, to build orbital occupancies. SCIResult is constructed without
        rdm1 or rdm2, and nothing reads a 2-RDM file at all. The data exists on
        disk in the temp directory, which clean_temp_dir=True deletes by default.
      workaround: >
        Pass clean_temp_dir=False and parse spin1RDM.*.txt yourself. Outside the
        addon's API.

  - feature: rdm
    solver: sbd
    engine: {value: "yes", confidence: verified}
    python:
      value: "yes"
      confidence: verified
      since: "1.7.1"
      source: "python/sbd_solver.py:465 assemble_rdms"
      detail: >
        Requires do_rdm=1. assemble_rdms builds spin-summed rdm1/rdm2 from
        SBD's raw one_p_rdm/two_p_rdm and populates SCIResult. Confirmed
        present at the 1.7.1 tag, not only on main. The `since` is the release
        it was verified in, not necessarily the one that introduced it.
    addon:
      value: "yes"
      confidence: verified
      blocked_by: keyword-only
      source: "tpb/sbdiag.h:41, gdb/sbdiag.h:26"
      detail: >
        Reachable, and the only obstacle is one argument. RDMs are off by
        default (`int do_rdm = 0` in both the TPB and GDB cores) because the
        SQD loop needs the energy and amplitudes and nothing else, so paying
        for RDMs on every iteration would be waste. Set do_rdm through
        sbd_config, which is keyword-only, and the returned best SCIResult
        carries them. The standalone CLI takes the same setting as a flag
        (tpb/sbdiag.h:112).
      workaround: "create_sbd_solver(sbd_config={'do_rdm': 1})"

  - feature: rdm
    solver: fulqrum-cpu
    engine:
      value: "no"
      confidence: verified
      detail: >
        No RDM code outside the GPU path, in either the Python or the C++
        layer. Fulqrum gained RDMs on the GPU only, so a researcher who needs
        them for embedding or fragmentation and has no NVIDIA hardware does
        not get them here. The adapter populates SCIResult with energy,
        sci_state and orbital_occupancies only
        (fulqrum/addon_sqd_support.py:325), leaving rdm1 and rdm2 unset.
      workaround: >
        fulqrum/test/rdm_oracle.py is a short, self-contained NumPy
        implementation of spin-resolved 1- and 2-RDMs over an arbitrary
        determinant list, in the PySCF `make_rdm12s(reorder=True)` convention.
        `rdm12s(alpha, beta, coeff, m, rank)` takes the uint64 keys and
        amplitudes a CPU eigenvector already provides. It sits under `test/`
        with no API stability, and is written for correctness rather than for
        production determinant counts, so offer it only to someone willing to
        maintain their own copy.
  - feature: rdm
    solver: fulqrum-gpu
    engine:
      value: "yes"
      maturity: verified
      unreleased: true
      confidence: verified
      source: "fulqrum/gpu/full_strs/hamiltonian.py:704"
      detail: >
        FullStrsHamiltonian.compute_rdms (`rank=1` or `2`, `spin_summed=`) is
        collective over the communicator and returns full host arrays on every
        rank. Return forms and tensor indices follow PySCF
        `make_rdm12s(reorder=True)` (hamiltonian.py:59), so an embedding
        workflow written against PySCF can consume them directly. Dedicated
        kernels under fulqrum/gpu/kernels/rdm/, not a host fallback.
      verified_by: >
        fulqrum/test/test_gpu_rdm.py, against fulqrum/test/rdm_oracle.py — an
        independent CPU implementation of spin-resolved RDMs in the same
        convention, itself checked against PySCF FCI
        (test_oracle_matches_pyscf). Covers H-chains and Fe4S4 from a bundled
        FCIDUMP, rank-1 against rank-2, spin-summed against block forms, RDM
        invariants, argument validation and multi-rank error propagation.
      verification_status: >
        Passed on a CUDA device. Gated out of CI, like the rest of the GPU
        suite: every GPU test requires `gpu_available()` and no runner in
        .github/workflows/ has a device.
      workaround: >
        These RDMs do not reach diagonalize_fermionic_hamiltonian, since the
        GPU path ships no sci_solver adapter — the caller drives
        FullStrsHamiltonian directly.

  # ── Spin penalty ──────────────────────────────────────────────────────────
  - feature: spin-penalty
    solver: pyscf
    python:
      value: "yes"
      confidence: verified
      source: "fci.addons.fix_spin_(myci, ss=spin_sq)"
    addon:
      value: "yes"
      confidence: verified
      blocked_by: keyword-only
      workaround: "partial(solve_sci_batch, spin_sq=0.0)"

  - feature: spin-penalty
    solver: dice
    engine: {value: "yes", confidence: verified, since: "0.3.0"}
    python:
      value: "yes"
      since: "0.3.0"
      confidence: verified
      source: "dice_solver.py:573"
      detail: >
        _write_input_files emits `spin {spin_sq}` into input.dat when spin_sq is
        not None, so it reaches the binary. Not signature-only.
    addon:
      value: "yes"
      confidence: verified
      blocked_by: keyword-only
      workaround: "partial(solve_sci_batch, spin_sq=0.0)"

  - feature: spin-penalty
    solver: sbd
    engine: {value: "no", confidence: verified}
    python:
      value: "no"
      confidence: verified
      source: "python/sbd_solver.py:75, docstring at :92"
      caveat: accepted-but-ignored
      detail: >
        solve_sci accepts spin_sq for signature compatibility with
        qiskit_addon_sqd.fermion.solve_sci and does nothing with it; the
        docstring says "unused by SBD". A workflow that passes spin_sq and swaps
        PySCF for SBD loses spin penalization with no error, no warning, and
        exit code zero. The most dangerous substitution in this registry.

  - feature: spin-penalty
    solver: fulqrum-cpu
    python:
      value: "yes"
      maturity: supported
      confidence: verified
      caveat: "no spin feature; caller builds the operator"
      source: "fulqrum/core/fermi_operator.pyx:56, fulqrum/convert/src/integrals.hpp:58"
      verification_status: >
        No Fulqrum test covers a user-written spin penalty, so this rests on
        checks against PySCF rather than the package's own suite. A hand-built
        S^2 matched pyscf.fci.spin_op.contract_ss elementwise, and penalizing
        a stretched H4 chain selected the lowest state of the targeted spin at
        the PySCF FCI energy. Every check used the full determinant space; the
        truncated subspaces SQD actually runs on are untested.
      detail: >
        Nothing ships ready to use: Fulqrum has no S^2 operator and no
        spin_sq argument, so a caller builds the penalty themselves.
        FermionicOperator takes arbitrary `++--` terms and supports `+` and
        scalar `*`, so S^2 is expressible, and `H + c * S_sq` reaches
        SubspaceHamiltonian through
        extended_jw_transformation like any other operator. The mode ordering
        is the trap: integrals.hpp:58 puts alpha in modes 0..norb-1 and beta
        in norb..2*norb-1, so an S^2 written for the interleaved convention is
        silently a different operator. The reported eigenvalue also includes
        the penalty, making the physical energy `energy - c * <S^2>`.
    addon:
      value: "no"
      confidence: verified
      source: "fulqrum/addon_sqd_support.py:42, :93"
      tracking: https://github.com/Qiskit/qiskit-addon-sqd/issues/312
      detail: >
        No blocked_by: there is no penalty in Fulqrum for the adapter to drop.
        It takes integrals rather than an operator and builds the operator
        itself, and the operator-accepting factory below it is private, so a
        caller holding `H + c * S_sq` has nowhere to put it. A
        `partial(..., spin_sq=0.0)` binding carried over from PySCF or Dice
        raises TypeError, since the adapter takes no such argument, as does
        passing spin_sq to the factory. Building Fulqrum's solver fresh and
        not mentioning spin_sq loses the penalty in silence, exactly as the
        SBD substitution does.
  - feature: spin-penalty
    solver: fulqrum-gpu
    python:
      value: unknown
      confidence: unverified
      source: "fulqrum/gpu/distributed/operator_check.pyx"
      tracking: https://github.com/Qiskit/qiskit-addon-sqd/issues/312
      detail: >
        Nothing ships a penalty on either Fulqrum path, so this is the same
        question the fulqrum-cpu cell answers yes for: whether a caller-built
        S^2 is an operator the GPU accepts. Most of that reasoning carries
        over. S^2 is two-body, spin-conserving and real, which is the shape the
        GPU asks for, and it wants the block spin ordering Fulqrum already
        uses.

        Unresolved: the cross-sector S+S- terms, which move one alpha and one
        beta. The GPU rejects term-group patterns it cannot plan —
        `unsupported_groups` in operator_check.pyx, with reasons including
        crosses_sectors and cross_sign_not_separable — and whether S^2's groups
        land in a supported tier depends on group tiering that was not traced.
        Build S^2 and call `unsupported_groups` to settle it.

  # ── Multiple roots ────────────────────────────────────────────────────────
  - feature: multiple-roots
    solver: pyscf
    python:
      value: unclear
      confidence: unverified
      detail: >
        **kwargs forwards nroots to kernel_fixed_space, which accepts it, but
        solve_sci builds a single SCIResult from sci_vec, so more than one root
        probably does not survive the wrapper. Not tested.
    addon:
      value: "no"
      confidence: verified
      blocked_by: loop-contract

  - feature: multiple-roots
    solver: dice
    engine: {value: "yes", confidence: verified, since: "0.3.0"}
    python:
      value: "yes"
      unreleased: true
      since: unreleased-main
      detail_release: >
        n_roots and the solve_sci entry point exist only on main, 24 commits
        past the 0.3.0 tag. 0.3.0 itself exposes solve_dice, solve_fermion and
